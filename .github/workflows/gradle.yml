name: Build and publish
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - name: Select version
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/release_version.py >> "$GITHUB_OUTPUT"
      - name: Build and stage Maven API
        run: ./gradlew --no-daemon build :acceleration-api:publishMavenPublicationToStagingRepository -PreleaseVersion=${{ steps.version.outputs.version }}
      - name: Publishing tests and Velocity API compatibility guard
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s tests/integration -p 'test_*.py'
          git diff --exit-code ed4c46ef -- api/src/main/java/com/velocitypowered api/src/ap
      - name: Integration tests
        run: |
          python3 tests/integration/proxy_chain.py proxy/build/libs/*-all.jar
          python3 tests/integration/apdp_network.py proxy/build/libs/*-all.jar
          python3 tests/integration/adcr_commands.py proxy/build/libs/*-all.jar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distribution
          path: |
            proxy/build/libs/*-all.jar
            build/maven-repository/
          if-no-files-found: error
  publish:
    needs: build
    if: >-
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: maven-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: distribution
          path: distribution
      - run: pip install boto3==1.40.70
      - name: Publish Maven to R2
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 scripts/publish_maven.py distribution/build/maven-repository
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          cp distribution/proxy/build/libs/*-all.jar release/
          cd release
          sha256sum *.jar > SHA256SUMS
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes ./*
          else
            tag="dev-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "Development $tag" --notes "Development build from $GITHUB_SHA" ./*
          fi
